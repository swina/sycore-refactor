name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/views/WebsiteView.vue'
      - 'src/website-main.js'
      - 'website.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.website'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static website
        run: npm run build:website
        env:
          VITE_PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
